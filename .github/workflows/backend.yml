name: Backend

on:
  push:
  pull_request:

jobs:
  check:
    if: github.repository == 'NotADeveloper7/jellyswarm' || github.repository == 'jellyswarm/jelly-swarm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build production API image
        run: docker build --tag jellyswarm-api:ci -f apps/api/Dockerfile .

  publish:
    needs: check
    if: github.repository == 'NotADeveloper7/jellyswarm' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: APP_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/notadeveloper7/jellyswarm-api:latest
            ghcr.io/notadeveloper7/jellyswarm-api:${{ github.sha }}

  deploy:
    needs: publish
    if: github.repository == 'NotADeveloper7/jellyswarm' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 20 "$RENDER_DEPLOY_HOOK_URL" || echo "Render hook did not respond; deployment can be retried in Render."
