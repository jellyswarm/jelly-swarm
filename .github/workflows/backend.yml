name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'jellyswarm/jelly-swarm'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: jellyswarm
          POSTGRES_PASSWORD: jellyswarm
          POSTGRES_DB: jellyswarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jellyswarm -d jellyswarm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.5"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
        env:
          DATABASE_URL: postgres://jellyswarm:jellyswarm@127.0.0.1:5432/jellyswarm_test
          RUN_DB_TESTS: "1"
      - name: Test server-side API proxy
        working-directory: .
        run: bun test ./api
      - run: bun run check
      - run: bun audit
      - name: Build production image
        run: docker build --build-arg APP_COMMIT_SHA=${{ github.sha }} --tag jellyswarm-backend:ci .

  codeql:
    if: github.repository == 'jellyswarm/jelly-swarm' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@9418214df1f2c4b8128c770156c409013b07d6b9
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9

  secret-scan:
    if: github.repository == 'jellyswarm/jelly-swarm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  build-push:
    needs: [check, codeql, secret-scan]
    if: github.repository == 'jellyswarm/jelly-swarm' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: ./backend
          push: true
          build-args: APP_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/jellyswarm/jellyswarm-backend:latest
            ghcr.io/jellyswarm/jellyswarm-backend:${{ github.sha }}

  release:
    needs: build-push
    if: github.repository == 'jellyswarm/jelly-swarm' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create tagged GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="backend-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    if: github.repository == 'jellyswarm/jelly-swarm' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 --output /dev/null --request POST "$RENDER_DEPLOY_HOOK_URL" || echo "Render hook did not respond; deployment can be retried in Render."
