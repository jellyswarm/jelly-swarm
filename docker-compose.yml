# Local development infrastructure. Host ports are offset (5433, 6380) so they
# do not clash with a locally installed Postgres or Redis.
name: jelly-core
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jelly
      POSTGRES_PASSWORD: jelly
      POSTGRES_DB: jelly
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jelly -d jelly"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
