# Local development infrastructure. Host ports are offset (5433, 6380) so they
# do not clash with a locally installed Postgres or Redis.
name: jelly-core
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jelly
      POSTGRES_PASSWORD: jelly
      POSTGRES_DB: jelly
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jelly -d jelly"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional: the app itself, containerized (see apps/api/Dockerfile, apps/web/Dockerfile).
  # Not started by `pnpm infra:up`; run explicitly with `docker compose up api web`.
  # SIGNER_PRIVATE_KEY and the other signing keys still need real values (see .env.example) —
  # there is no safe default for those.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://jelly:jelly@postgres:5432/jelly
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      PORT: "4173"
      API_URL: http://api:3000
    env_file:
      - .env
    ports:
      - "4173:4173"
    depends_on:
      api:
        condition: service_started
    profiles: ["app"]

volumes:
  pgdata:
  redisdata:
